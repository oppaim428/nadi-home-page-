<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#04181b" />
<meta name="description" content="NadiPlayer — Premium IPTV experience for TV, phone and tablet." />
<link rel="icon" type="image/png" href="https://customer-assets.emergentagent.com/job_nadiplayer-download/artifacts/g9o2r79a_icons.png" />
<link rel="apple-touch-icon" href="https://customer-assets.emergentagent.com/job_nadiplayer-download/artifacts/g9o2r79a_icons.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700;800;900&family=Italiana&family=Tenor+Sans&family=Playfair+Display:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700;800;900&family=Sora:wght@300;400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<title>NadiPlayer — Premium IPTV for TV, Phone &amp; Tablet</title>
<script defer="defer" src="/static/js/main.0876a27d.js"></script>
<link href="/static/css/main.850c951a.css" rel="stylesheet" />
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>

<!-- Floating WhatsApp button (visible at all times, phone from /api/site-config) -->
<style>
  #np-wa-fab{position:fixed;right:20px;bottom:20px;z-index:99999;display:none;align-items:center;gap:10px;padding:12px 18px;border-radius:9999px;background:#25d366;color:#fff !important;text-decoration:none;font-family:Outfit,system-ui,sans-serif;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(37,211,102,.45),0 0 0 4px rgba(37,211,102,.15);transition:transform .25s ease,box-shadow .25s ease;animation:np-wa-pulse 2.4s infinite}
  #np-wa-fab i{font-size:22px;line-height:1}
  #np-wa-fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 36px rgba(37,211,102,.55),0 0 0 6px rgba(37,211,102,.18)}
  #np-wa-fab .np-wa-label{display:inline}
  @media (max-width:640px){#np-wa-fab{padding:14px;font-size:0}#np-wa-fab .np-wa-label{display:none}#np-wa-fab i{font-size:24px}}
  @keyframes np-wa-pulse{0%,100%{box-shadow:0 10px 30px rgba(37,211,102,.45),0 0 0 0 rgba(37,211,102,.5)}50%{box-shadow:0 10px 30px rgba(37,211,102,.45),0 0 0 14px rgba(37,211,102,0)}}
</style>
<a id="np-wa-fab" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp" data-testid="whatsapp-fab">
  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
  <span class="np-wa-label">WhatsApp</span>
</a>
<script>
(function(){
  function buildLink(num,msg){
    var clean=String(num||"").replace(/[^0-9]/g,"");
    if(!clean) return null;
    var u="https://wa.me/"+clean;
    if(msg) u+="?text="+encodeURIComponent(msg);
    return u;
  }
  function applyCfg(cfg){
    var fab=document.getElementById("np-wa-fab");
    if(!fab) return;
    var url=buildLink(cfg && cfg.whatsapp_number, cfg && cfg.whatsapp_message);
    if(url){ fab.href=url; fab.style.display="inline-flex"; }
    else { fab.style.display="none"; }
  }
  function load(){
    fetch("/api/site-config",{credentials:"omit"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(cfg){ if(cfg) applyCfg(cfg); })
      .catch(function(){});
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",load);
  } else { load(); }
  // Re-fetch when admin saves (poll every 60s so floating button picks up new number).
  setInterval(load, 60000);
})();
</script>

<!-- Admin-only WhatsApp settings panel (shows on /admin pages when logged in) -->
<style>
  #np-wa-admin{position:fixed;left:20px;bottom:20px;z-index:99998;width:340px;max-width:calc(100vw - 40px);background:#0b2225;color:#fff;font-family:Outfit,system-ui,sans-serif;border:1px solid rgba(212,164,55,.35);border-radius:14px;padding:0;display:none;box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
  #np-wa-admin.open{display:block}
  #np-wa-admin .np-wa-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,rgba(37,211,102,.18),rgba(212,164,55,.12));border-bottom:1px solid rgba(255,255,255,.08)}
  #np-wa-admin .np-wa-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#e5b73b;display:flex;align-items:center;gap:8px}
  #np-wa-admin .np-wa-title i{color:#25d366}
  #np-wa-admin .np-wa-close{background:transparent;border:0;color:rgba(255,255,255,.6);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px}
  #np-wa-admin .np-wa-body{padding:14px;display:flex;flex-direction:column;gap:10px}
  #np-wa-admin label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);display:block;margin-bottom:4px}
  #np-wa-admin input,#np-wa-admin textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 11px;color:#fff;font:14px Outfit,system-ui,sans-serif;outline:none}
  #np-wa-admin input:focus,#np-wa-admin textarea:focus{border-color:rgba(212,164,55,.6)}
  #np-wa-admin textarea{resize:vertical;min-height:60px}
  #np-wa-admin .np-wa-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:4px}
  #np-wa-admin button.np-wa-save{background:#e5b73b;color:#0b2225;border:0;border-radius:9999px;padding:8px 16px;font-weight:700;font-size:13px;letter-spacing:.05em;cursor:pointer;text-transform:uppercase}
  #np-wa-admin button.np-wa-save:disabled{opacity:.5;cursor:wait}
  #np-wa-admin .np-wa-status{font-size:12px;color:rgba(255,255,255,.6);min-height:16px}
  #np-wa-admin .np-wa-status.ok{color:#5fcc8c}
  #np-wa-admin .np-wa-status.err{color:#ff8585}
  #np-wa-toggle{position:fixed;left:20px;bottom:20px;z-index:99997;display:none;align-items:center;gap:8px;padding:10px 14px;border-radius:9999px;background:#0b2225;color:#e5b73b;border:1px solid rgba(212,164,55,.5);font:600 13px Outfit,system-ui,sans-serif;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  #np-wa-toggle i{color:#25d366}
  #np-wa-toggle:hover{background:#0e2b2f}
</style>
<button id="np-wa-toggle" type="button" data-testid="whatsapp-admin-toggle"><i class="fa-brands fa-whatsapp"></i> WhatsApp Settings</button>
<div id="np-wa-admin" data-testid="whatsapp-admin-panel" role="dialog" aria-label="WhatsApp settings">
  <div class="np-wa-head">
    <div class="np-wa-title"><i class="fa-brands fa-whatsapp"></i> WhatsApp Floating Button</div>
    <button type="button" class="np-wa-close" data-testid="whatsapp-admin-close" aria-label="Close">&times;</button>
  </div>
  <div class="np-wa-body">
    <div>
      <label for="np-wa-num">Phone number (international, with country code)</label>
      <input id="np-wa-num" type="tel" placeholder="+966500000000" data-testid="whatsapp-admin-number" autocomplete="off" />
    </div>
    <div>
      <label for="np-wa-msg">Pre-filled message (optional)</label>
      <textarea id="np-wa-msg" placeholder="Hello, I'm interested in NadiPlayer IPTV." data-testid="whatsapp-admin-message"></textarea>
    </div>
    <div class="np-wa-status" id="np-wa-status"></div>
    <div class="np-wa-actions">
      <button type="button" class="np-wa-save" data-testid="whatsapp-admin-save">Save</button>
    </div>
  </div>
</div>
<script>
(function(){
  function isAdminRoute(){ return /^\/admin\b/.test(location.pathname); }
  function getToken(){
    try{
      // The React app stores its JWT in localStorage; common keys used by the SPA.
      var keys=["nadi_admin_token","admin_token","token","access_token"];
      for(var i=0;i<keys.length;i++){
        var v=localStorage.getItem(keys[i]);
        if(v && v.length>20) return v;
      }
      // Fallback: scan all keys for a JWT-shaped value.
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i); var v=localStorage.getItem(k);
        if(v && /^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(v)) return v;
      }
    }catch(e){}
    return null;
  }
  function show(panel){ panel.classList.add("open"); document.getElementById("np-wa-toggle").style.display="none"; }
  function hide(panel){ panel.classList.remove("open"); document.getElementById("np-wa-toggle").style.display="inline-flex"; }
  function setStatus(text,kind){
    var s=document.getElementById("np-wa-status");
    if(!s) return;
    s.textContent=text||"";
    s.className="np-wa-status"+(kind?(" "+kind):"");
  }
  function init(){
    var toggle=document.getElementById("np-wa-toggle");
    var panel=document.getElementById("np-wa-admin");
    if(!toggle||!panel) return;
    function maybeShow(){
      if(!isAdminRoute()){ toggle.style.display="none"; panel.classList.remove("open"); return; }
      var t=getToken();
      if(!t){ toggle.style.display="none"; panel.classList.remove("open"); return; }
      // Only show toggle once user is logged in (token present).
      toggle.style.display="inline-flex";
    }
    maybeShow();
    setInterval(maybeShow, 1500);

    toggle.addEventListener("click", async function(){
      var token=getToken();
      if(!token){ alert("Please sign in first."); return; }
      try{
        var r=await fetch("/api/admin/site-config",{headers:{"Authorization":"Bearer "+token}});
        if(!r.ok) throw new Error("HTTP "+r.status);
        var cfg=await r.json();
        document.getElementById("np-wa-num").value = cfg.whatsapp_number || "";
        document.getElementById("np-wa-msg").value = cfg.whatsapp_message || "";
        setStatus("");
        show(panel);
      }catch(e){ alert("Could not load config: "+e.message); }
    });
    panel.querySelector(".np-wa-close").addEventListener("click", function(){ hide(panel); });
    panel.querySelector(".np-wa-save").addEventListener("click", async function(ev){
      var btn=ev.currentTarget;
      var token=getToken();
      if(!token){ setStatus("Not authenticated.","err"); return; }
      btn.disabled=true; setStatus("Saving…");
      try{
        var num=document.getElementById("np-wa-num").value.trim();
        var msg=document.getElementById("np-wa-msg").value;
        var r=await fetch("/api/admin/site-config",{
          method:"PUT",
          headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
          body: JSON.stringify({ whatsapp_number:num, whatsapp_message:msg })
        });
        if(!r.ok) throw new Error("HTTP "+r.status);
        setStatus("Saved. The floating button will refresh on next page load.","ok");
        // Trigger immediate refresh of the public floating button on this tab too.
        try{ var fab=document.getElementById("np-wa-fab"); if(fab){ fab.dataset.refresh=Date.now(); } }catch(e){}
      }catch(e){ setStatus("Save failed: "+e.message,"err"); }
      finally{ btn.disabled=false; }
    });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); }
  else { init(); }
})();
</script>
</body>
</html>
