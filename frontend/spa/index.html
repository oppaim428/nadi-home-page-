  #np-wa-fab i{font-size:22px;line-height:1}
  #np-wa-fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 36px rgba(37,211,102,.55),0 0 0 6px rgba(37,211,102,.18)}
  #np-wa-fab .np-wa-label{display:inline}
  @media (max-width:640px){#np-wa-fab{padding:14px;font-size:0}#np-wa-fab .np-wa-label{display:none}#np-wa-fab i{font-size:24px}}
  @keyframes np-wa-pulse{0%,100%{box-shadow:0 10px 30px rgba(37,211,102,.45),0 0 0 0 rgba(37,211,102,.5)}50%{box-shadow:0 10px 30px rgba(37,211,102,.45),0 0 0 14px rgba(37,211,102,0)}}

<a id="np-wa-fab" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp" data-testid="whatsapp-fab">
  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
  <span class="np-wa-label">WhatsApp</span>
</a>
<script>
(function(){
  function buildLink(num,msg){
    var clean=String(num||"").replace(/[^0-9]/g,"");
    if(!clean) return null;
    var u="https://wa.me/"+clean;
    if(msg) u+="?text="+encodeURIComponent(msg);
    return u;
  }
  function applyCfg(cfg){
    var fab=document.getElementById("np-wa-fab");
    if(!fab) return;
    var url=buildLink(cfg && cfg.whatsapp_number, cfg && cfg.whatsapp_message);
    if(url){ fab.href=url; fab.style.display="inline-flex"; }
    else { fab.style.display="none"; }
  }
  function load(){
    fetch("/api/site-config",{credentials:"omit"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(cfg){ if(cfg) applyCfg(cfg); })
      .catch(function(){});
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",load);
  } else { load(); }
  // Re-fetch when admin saves (poll every 60s so floating button picks up new number).
  setInterval(load, 60000);
})();
</script>

<script>
(function(){
  function isAdminRoute(){ return /^\/admin\b/.test(location.pathname); }
  function getToken(){
    try{
      // The React app stores its JWT in localStorage; common keys used by the SPA.
      var keys=["nadi_admin_token","admin_token","token","access_token"];
      for(var i=0;i<keys.length;i++){
        var v=localStorage.getItem(keys[i]);
        if(v && v.length>20) return v;
      }
      // Fallback: scan all keys for a JWT-shaped value.
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i); var v=localStorage.getItem(k);
        if(v && /^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(v)) return v;
      }
    }catch(e){}
    return null;
  }
  function show(panel){ panel.classList.add("open"); document.getElementById("np-wa-toggle").style.display="none"; }
  function hide(panel){ panel.classList.remove("open"); document.getElementById("np-wa-toggle").style.display="inline-flex"; }
  function setStatus(text,kind){
    var s=document.getElementById("np-wa-status");
    if(!s) return;
    s.textContent=text||"";
    s.className="np-wa-status"+(kind?(" "+kind):"");
  }
  function init(){
    var toggle=document.getElementById("np-wa-toggle");
    var panel=document.getElementById("np-wa-admin");
    if(!toggle||!panel) return;
    function maybeShow(){
      if(!isAdminRoute()){ toggle.style.display="none"; panel.classList.remove("open"); return; }
      var t=getToken();
      if(!t){ toggle.style.display="none"; panel.classList.remove("open"); return; }
      // Only show toggle once user is logged in (token present).
      toggle.style.display="inline-flex";
    }
    maybeShow();
    setInterval(maybeShow, 1500);

    toggle.addEventListener("click", async function(){
      var token=getToken();
      if(!token){ alert("Please sign in first."); return; }
      try{
        var r=await fetch("/api/admin/site-config",{headers:{"Authorization":"Bearer "+token}});
        if(!r.ok) throw new Error("HTTP "+r.status);
        var cfg=await r.json();
        document.getElementById("np-wa-num").value = cfg.whatsapp_number || "";
        document.getElementById("np-wa-msg").value = cfg.whatsapp_message || "";
        setStatus("");
        show(panel);
      }catch(e){ alert("Could not load config: "+e.message); }
    });
    panel.querySelector(".np-wa-close").addEventListener("click", function(){ hide(panel); });
    panel.querySelector(".np-wa-save").addEventListener("click", async function(ev){
      var btn=ev.currentTarget;
      var token=getToken();
      if(!token){ setStatus("Not authenticated.","err"); return; }
      btn.disabled=true; setStatus("Saving…");
      try{
        var num=document.getElementById("np-wa-num").value.trim();
        var msg=document.getElementById("np-wa-msg").value;
        var r=await fetch("/api/admin/site-config",{
          method:"PUT",
          headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
          body: JSON.stringify({ whatsapp_number:num, whatsapp_message:msg })
        });
        if(!r.ok) throw new Error("HTTP "+r.status);
        setStatus("Saved. The floating button will refresh on next page load.","ok");
        // Trigger immediate refresh of the public floating button on this tab too.
        try{ var fab=document.getElementById("np-wa-fab"); if(fab){ fab.dataset.refresh=Date.now(); } }catch(e){}
      }catch(e){ setStatus("Save failed: "+e.message,"err"); }
      finally{ btn.disabled=false; }
    });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); }
  else { init(); }
})();
</script>

<!-- Public-side background override: applies cosmic_bg_url / yellow_bg_url / premium_bg_url over the baked-in gradients. -->
<style>
  #np-theme-bg{position:fixed;inset:0;z-index:-9;background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none;opacity:0;transition:opacity .4s ease}
  #np-theme-bg.on{opacity:1}
  #np-theme-bg-dim{position:fixed;inset:0;z-index:-8;background:linear-gradient(to bottom,rgba(0,0,0,.18),rgba(0,0,0,.32));pointer-events:none;opacity:0;transition:opacity .4s ease}
  #np-theme-bg-dim.on{opacity:1}
  /* When custom background is active, let it show through the SPA root container. */
  html.np-has-bg, html.np-has-bg body{background:transparent !important}
  html.np-has-bg .App,
  html.np-has-bg [data-testid="landing-page"]{background-color:transparent !important}
</style>
<div id="np-theme-bg" aria-hidden="true"></div>
<div id="np-theme-bg-dim" aria-hidden="true"></div>
<script>
(function(){
  function pickBg(cfg){
    if(!cfg) return "";
    var t=(cfg.theme||"cosmic").toLowerCase();
    if(t==="yellow")  return cfg.yellow_bg_url || "";
    if(t==="premium") return cfg.premium_bg_url || cfg.nebula_bg_url || "";
    return cfg.cosmic_bg_url || "";
  }
  function apply(cfg){
    var bg=document.getElementById("np-theme-bg");
    var dim=document.getElementById("np-theme-bg-dim");
    if(!bg||!dim) return;
    var url=pickBg(cfg);
    if(url){
      bg.style.backgroundImage="url('"+url.replace(/'/g,"%27")+"')";
      bg.classList.add("on"); dim.classList.add("on");
      document.documentElement.classList.add("np-has-bg");
    } else {
      bg.style.backgroundImage=""; bg.classList.remove("on"); dim.classList.remove("on");
      document.documentElement.classList.remove("np-has-bg");
    }
  }
  function load(){
    fetch("/api/site-config",{credentials:"omit"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(cfg){ if(cfg) apply(cfg); })
      .catch(function(){});
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", load); }
  else { load(); }
  setInterval(load, 60000);
})();
</script>

<script>
(function(){
  var THEMES=[
    {key:"cosmic_bg_url",  label:"Cosmic Gold",   hint:"Dark teal nebula background"},
    {key:"yellow_bg_url",  label:"Bold Yellow",   hint:"Background behind the Yellow theme hero"},
    {key:"premium_bg_url", label:"IPTV Premium",  hint:"Full-bleed cinematic background (also uses NEBULA BACKGROUND if set)"}
  ];
  function isAdminRoute(){ return /^\/admin\b/.test(location.pathname); }
  function getToken(){
    try{
      var keys=["nadi_admin_token","admin_token","token","access_token"];
      for(var i=0;i<keys.length;i++){ var v=localStorage.getItem(keys[i]); if(v && v.length>20) return v; }
      for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); var v=localStorage.getItem(k); if(v && /^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(v)) return v; }
    }catch(e){}
    return null;
  }
  function setStatus(text,kind){
    var s=document.getElementById("np-bg-status"); if(!s) return;
    s.textContent=text||""; s.className="np-bg-status"+(kind?(" "+kind):"");
  }
  function buildRow(t, value){
    var id=t.key;
    var row=document.createElement("div");
    row.className="np-bg-row";
    row.innerHTML=
      '<h4>'+t.label+'</h4>'+
      '<div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:8px">'+t.hint+'</div>'+
      '<div class="np-bg-grid">'+
        '<div class="np-bg-thumb" id="thumb_'+id+'"></div>'+
        '<input type="text" placeholder="https://… or /api/uploads/…" data-testid="bg-input-'+id+'" id="inp_'+id+'" />'+
      '</div>'+
      '<div class="np-bg-actions">'+
        '<button type="button" data-act="upload" data-key="'+id+'" data-testid="bg-upload-'+id+'"><i class="fa-solid fa-upload"></i> Upload</button>'+
        '<button type="button" class="np-bg-clear" data-act="clear" data-key="'+id+'" data-testid="bg-clear-'+id+'">Clear</button>'+
      '</div>';
    var inp=row.querySelector("#inp_"+id);
    var thumb=row.querySelector("#thumb_"+id);
    inp.value=value||"";
    function refreshThumb(){ thumb.style.backgroundImage = inp.value ? "url('"+inp.value.replace(/'/g,"%27")+"')" : ""; }
    refreshThumb();
    inp.addEventListener("input", refreshThumb);
    return row;
  }
  function fileInput(cb){
    var f=document.createElement("input"); f.type="file"; f.accept="image/*";
    f.addEventListener("change", function(){ if(f.files && f.files[0]) cb(f.files[0]); });
    f.click();
  }
  async function uploadFile(file){
    var token=getToken(); if(!token) throw new Error("Not authenticated");
    var fd=new FormData(); fd.append("file", file);
    var r=await fetch("/api/admin/upload",{method:"POST",headers:{"Authorization":"Bearer "+token},body:fd});
    if(!r.ok){ var t=await r.text(); throw new Error("Upload failed: "+r.status+" "+t); }
    return r.json();
  }
  function init(){
    var toggle=document.getElementById("np-bg-toggle");
    var panel=document.getElementById("np-bg-admin");
    var rowsEl=document.getElementById("np-bg-rows");
    if(!toggle||!panel||!rowsEl) return;

    function maybeShow(){
      if(!isAdminRoute() || !getToken()){ toggle.style.display="none"; panel.classList.remove("open"); return; }
      toggle.style.display="inline-flex";
    }
    maybeShow();
    setInterval(maybeShow, 1500);

    toggle.addEventListener("click", async function(){
      var token=getToken(); if(!token){ alert("Please sign in first."); return; }
      try{
        var r=await fetch("/api/admin/site-config",{headers:{"Authorization":"Bearer "+token}});
        if(!r.ok) throw new Error("HTTP "+r.status);
        var cfg=await r.json();
        rowsEl.innerHTML="";
        THEMES.forEach(function(t){ rowsEl.appendChild(buildRow(t, cfg[t.key])); });
        setStatus(""); panel.classList.add("open");
      }catch(e){ alert("Could not load config: "+e.message); }
    });

    panel.querySelector(".np-bg-close").addEventListener("click", function(){ panel.classList.remove("open"); });

    rowsEl.addEventListener("click", function(ev){
      var btn=ev.target.closest("button[data-act]"); if(!btn) return;
      var key=btn.getAttribute("data-key");
      var act=btn.getAttribute("data-act");
      var inp=document.getElementById("inp_"+key);
      var thumb=document.getElementById("thumb_"+key);
      if(act==="clear"){
        inp.value=""; thumb.style.backgroundImage=""; return;
      }
      if(act==="upload"){
        fileInput(async function(file){
          btn.disabled=true; setStatus("Uploading "+file.name+"…");
          try{
            var res=await uploadFile(file);
            inp.value=res.url; thumb.style.backgroundImage="url('"+res.url+"')";
            setStatus("Uploaded. Click Save all to apply.","ok");
          }catch(e){ setStatus(e.message,"err"); }
          finally{ btn.disabled=false; }
        });
      }
    });

    panel.querySelector(".np-bg-save").addEventListener("click", async function(ev){
      var token=getToken(); if(!token){ setStatus("Not authenticated.","err"); return; }
      var btn=ev.currentTarget; btn.disabled=true; setStatus("Saving…");
      try{
        var body={};
        THEMES.forEach(function(t){ body[t.key]=document.getElementById("inp_"+t.key).value.trim(); });
        var r=await fetch("/api/admin/site-config",{
          method:"PUT",
          headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
        if(!r.ok) throw new Error("HTTP "+r.status);
        setStatus("Saved. Reload the site to see the new backgrounds.","ok");
      }catch(e){ setStatus("Save failed: "+e.message,"err"); }
      finally{ btn.disabled=false; }
    });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); }
  else { init(); }
})();
</script>
</body>
</html>
